<div class="container" *ngIf="!loading">
  <h2>Album Photos</h2>

  <div class="grid">
    <div class="photo" *ngFor="let photo of photos">
      <img [src]="photo.thumbnailUrl" [alt]="photo.title" />
      <p>{{ photo.title }}</p>
    </div>
  </div>

  <button (click)="goBack()">Back</button>
</div>

<div *ngIf="loading">Loading photos...</div>
