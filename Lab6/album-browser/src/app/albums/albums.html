<div class="container">
  <h2>Albums</h2>

  <div *ngIf="loading">Loading albums...</div>

  <div *ngIf="!loading && albums.length === 0">
    No albums found.
  </div>

  <ul *ngIf="!loading">
    <li *ngFor="let album of albums">
      <span [routerLink]="['/albums', album.id]" class="clickable">
        {{ album.id }} - {{ album.title }}
      </span>

      <button (click)="deleteAlbum(album.id)">Delete</button>
    </li>
  </ul>
</div>
